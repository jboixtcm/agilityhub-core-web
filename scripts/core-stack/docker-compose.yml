name: agilityhub-e1-w04

x-core-environment: &core-environment
  SPRING_PROFILES_ACTIVE: local
  ATTACHMENT_LOCAL_DIRECTORY: /app/attachments
  EXPORT_LOCAL_DIRECTORY: /app/exports
  MONGODB_HOST: mongo
  MONGODB_PORT: 27017
  MONGODB_DATABASE: agilityhub_e1_web
  MONGODB_REPLICA_SET: rs0
  OIDC_MASTER_KEY: ""
  AUTH_ISSUER: https://id.example.test
  OIDC_LOGIN_URL: https://id.example.test/login
  OIDC_ID_WEB_REDIRECT_URI: https://id.example.test/oidc/callback
  OIDC_ID_WEB_LOGOUT_URI: https://id.example.test/
  OIDC_CLUBS_APP_REDIRECT_URI: https://app.example.test/oidc/callback
  OIDC_CLUBS_APP_LOGOUT_URI: https://app.example.test/
  OIDC_CLUBS_ADMIN_REDIRECT_URI: https://admin.example.test/oidc/callback
  OIDC_CLUBS_ADMIN_LOGOUT_URI: https://admin.example.test/
  # E10-W02: the console's product host (S17 §2 «Entrada», `clubsadmin.*` without a club alias) is
  # a platform host, so its `GET /branding` answers the product's branding (E10-T04).
  CORS_PLATFORM_HOSTS: id.example.test,clubsadmin.example.test
  SHARED_SCHEDULING_ENABLED: "true"
  BILLING_BANK_KEY: ${BILLING_BANK_KEY:?BILLING_BANK_KEY is required}
  BILLING_SECRETS_KEY: ${BILLING_SECRETS_KEY:?BILLING_SECRETS_KEY is required}
  LOGGING_LEVEL_ROOT: WARN
  SPRING_MAIN_BANNER_MODE: "off"

services:
  mongo:
    image: mongo:7
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (error) {
            if (error.code !== 94) { throw error; }
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]});
          }
          if (!db.hello().isWritablePrimary) { quit(1); }
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  seed:
    image: ghcr.io/jboixtcm/agilityhub-core-api:main
    environment:
      <<: *core-environment
      SEED_PASSWORD: ${E1_CORE_PASSWORD:?E1_CORE_PASSWORD is required}
      # E10-W02: `1` for the console's stage only (`e2e-core.sh`), which applies the template club.
      SEED_TEMPLATE_CLUB: ${SEED_TEMPLATE_CLUB:-}
    entrypoint: [/bin/sh, -ec]
    working_dir: /app
    command:
      - |
        # E10-W02 round 2: since the image of 21-10 the club file seeds the club's production hosts
        # (`app.<domain>`, `admin.<domain>`), which no local server answers. The stack applies a copy
        # whose two domains are its own (`app.example.test`, `admin.example.test`, the hosts of the
        # OIDC URIs above and of every stage); the folder goes along for the pages' `bodyFile`.
        rm -rf /tmp/seeds && cp -r /app/seeds /tmp/seeds
        sed -i -e 's/host: "app\.[^"]*"/host: "app.example.test"/' \
          -e 's/host: "admin\.[^"]*"/host: "admin.example.test"/' /tmp/seeds/club-canic.yaml
        # A rewrite that matched nothing stops the stack here, not at a stage's `404 UNKNOWN_HOST`.
        grep -q 'host: "app.example.test"' /tmp/seeds/club-canic.yaml
        grep -q 'host: "admin.example.test"' /tmp/seeds/club-canic.yaml
        java -jar /app/app.jar --core.command=club:apply /tmp/seeds/club-canic.yaml
        java -jar /app/app.jar --core.command=club:apply /app/seeds/club-fifo.yaml
        java -jar /app/app.jar --core.command=club:apply /app/seeds/club-minim.yaml
        if [ "$${SEED_TEMPLATE_CLUB}" = "1" ]; then
          java -jar /app/app.jar --core.command=club:apply /app/seeds/club-template-default.yaml
        fi
        java -jar /app/app.jar --core.command=seed:demo --club=canic --seed=42 --week-start=${SEED_WEEK_START:-${E4_WEEK_START:?E4_WEEK_START is required}}
        java -jar /app/app.jar --core.command=seed:demo --club=fifo --seed=42 --week-start=${SEED_WEEK_START:-${E4_WEEK_START:?E4_WEEK_START is required}}
    volumes:
      - attachment-files:/app/attachments
      - export-files:/app/exports
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy

  activate-demo-club:
    image: mongo:7
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mongosh --quiet mongodb://mongo:27017/agilityhub_e1_web --eval '
          const result = db.clubs.updateMany(
            {slug: {$$in: ["canic", "fifo"]}},
            {$$set: {status: "ACTIVE", updatedAt: new Date()}}
          );
          if (result.matchedCount !== 2) { quit(1); }
          const accounts = db.accounts.find({
            email: {$$in: ["member@example.test", "member.2@example.test"]}
          }).toArray();
          const plan = db.plans.findOne({code: "ABONAT", active: true});
          // INC-68 (api E11-T08): validity days are stored as YYYY-MM-DD strings; older images stored BSON dates.
          const today = new Date().toISOString().slice(0, 10);
          const current = (field, op, value) => ({$$or: [{[field]: {[op]: value}}, {[field]: {[op]: new Date()}}]});
          const price = db.prices.find({
            planId: plan?._id,
            $$and: [
              current("validFrom", "$$lte", today),
              {$$or: [{validTo: {$$exists: false}}, {validTo: null}, current("validTo", "$$gte", today)]}
            ]
          }).sort({validFrom: -1}).limit(1).next();
          if (accounts.length !== 2 || !plan || !price) { quit(1); }
          const members = db.members.updateMany(
            {accountId: {$$in: accounts.map((account) => account._id)}, status: "ACTIVE"},
            {$$set: {planId: plan._id, priceId: price._id, updatedAt: new Date()}}
          );
          if (members.matchedCount !== 2) { quit(1); }
        '
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully

  core:
    image: ghcr.io/jboixtcm/agilityhub-core-api:main
    environment:
      <<: *core-environment
      SERVER_PORT: 8080
      MAIL_LOCAL_DIRECTORY: /app/mailbox
    ports:
      - "127.0.0.1:${CONSUMER_PORT:-18080}:8080"
    volumes:
      - attachment-files:/app/attachments
      - mailbox:/app/mailbox
      - export-files:/app/exports
    depends_on:
      mongo:
        condition: service_healthy
      activate-demo-club:
        condition: service_completed_successfully

  playwright:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    # E5-W05 round 2 (review #8): `run` forwards the INT/TERM it gets to the container, and a shell
    # as PID 1 ignores both. Under Docker's init (tini) the signal goes to the stage's process group
    # (TINI_KILL_PROCESS_GROUP), so Playwright stops with 130/143 and `e2e-core.sh` ends there.
    init: true
    working_dir: /work
    environment:
      CI: "1"
      TINI_KILL_PROCESS_GROUP: "1"
      CORE_URL: ${CORE_URL:?CORE_URL is required}
      E1_CORE_PASSWORD: ${E1_CORE_PASSWORD:?E1_CORE_PASSWORD is required}
      CORE_EVIDENCE_DIRECTORY: /evidence/${CORE_EVIDENCE_SUBDIRECTORY:-E1-W04}
      E1_EVIDENCE_DIRECTORY: /evidence/${CORE_EVIDENCE_SUBDIRECTORY:-E1-W04}
      E1_MAILBOX_DIRECTORY: /mailbox
      CORE_TEST_FILES: ${CORE_TEST_FILES:-}
      E4_WEEK_START: ${E4_WEEK_START:?E4_WEEK_START is required}
      E5_WEEK_START: ${E5_WEEK_START:-${E4_WEEK_START}}
      E8_WEEK_START: ${E8_WEEK_START:-${E5_WEEK_START:-${E4_WEEK_START}}}
      # E7-W03 round 2: `off` when `e2e-core.sh` gets `no-clock` (POST /test/clock treated as absent).
      CORE_CLOCK_DETECTION: ${CORE_CLOCK_DETECTION:-}
      E9_FORCE_BARE_RING_UNDO: ${E9_FORCE_BARE_RING_UNDO:-}
    volumes:
      - ../..:/src:ro
      - ../../roadmap/evidence:/evidence
      - mailbox:/mailbox:ro
      - ${CORE_PNPM_STORE_DIRECTORY:?CORE_PNPM_STORE_DIRECTORY is required}:/pnpm-store
    command:
      - /bin/sh
      - -ec
      - |
        tar --exclude=.git --exclude=.turbo --exclude=dist --exclude=node_modules --exclude=playwright-report --exclude=test-results -cf - -C /src . | tar -xf - -C /work
        corepack enable
        pnpm config set store-dir /pnpm-store
        pnpm install --frozen-lockfile
        pnpm exec playwright test --config=e2e/core/playwright.config.ts ${CORE_TEST_FILES:-}
    depends_on:
      core:
        condition: service_healthy

volumes:
  attachment-files:
  mongo-data:
  mailbox:
  export-files:
