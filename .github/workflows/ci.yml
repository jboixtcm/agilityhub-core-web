name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    # Retain time for cold checks, the full browser suite and artifact gates.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build
        run: pnpm turbo run lint typecheck test build --concurrency=2

      # E11-W03: the real-core specs are no workspace package, so turbo never typechecked them.
      - name: Typecheck the real-core specs
        run: pnpm typecheck:e2e-core

      - name: Check translations
        run: pnpm i18n:check

      - name: Check generated API types
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client/src/generated

      # Keep Node checks on their normal runner; only the browser suite needs
      # the validated image with Chromium, WebKit and their system libraries.
      - name: Run Playwright with MSW in Docker
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          E2E_EVIDENCE_TASK: feedback-20261106 ci
          E2E_CAPTURE_TASK: ci
        run: pnpm e2e:docker ci --workers=2

      - name: Check Clubs bundle size
        run: pnpm size-limit

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: roadmap/evidence/**/*.png
          if-no-files-found: error
          retention-days: 14
