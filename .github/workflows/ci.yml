name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    # Cold checks (~10m), browser dependencies (~10m) and the full MSW suite
    # (~12m) exceed 30m on hosted runners; retain time for size/artifact gates.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build
        run: pnpm turbo run lint typecheck test build --concurrency=2

      # E11-W03: the real-core specs are no workspace package, so turbo never typechecked them.
      - name: Typecheck the real-core specs
        run: pnpm typecheck:e2e-core

      - name: Check translations
        run: pnpm i18n:check

      - name: Check generated API types
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client/src/generated

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright with MSW
        run: pnpm turbo run e2e --concurrency=1 --log-order=stream

      - name: Check Clubs bundle size
        run: pnpm size-limit

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: roadmap/evidence/**/*.png
          if-no-files-found: error
          retention-days: 14
